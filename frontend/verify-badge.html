<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Badge - SkillBadge</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <nav>

        <h2>SkillBadge</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="issue-badge.html">Issue Badge</a>

            <a href="verify-badge.html">Verify Badge</a>

            <a href="wallet.html">Badge Wallet</a>

        </div>

    </nav>


    <!-- Main Content -->

    <main>

        <section class="form-section">

            <h1>Verify a Skill Badge</h1>

            <p>
                Enter the badge verification code to check
                whether a digital skill badge is valid.
            </p>


            <!-- Verification Form -->

            <form>

                <div class="form-group">

                    <label for="verificationCode">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        id="verificationCode"
                        name="verificationCode"
                        placeholder="Enter verification code"
                        required
                    >

                </div>


                <button type="submit" class="btn">
                    Verify Badge
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Verified Skill Badge Portal
        </p>

    </footer>


</body>

</html>
